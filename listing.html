<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyMatch &mdash; Your Matches</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page page--wide">
    <header class="page-header">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">&#128300;</span>
        <span class="brand-name">StudyMatch</span>
      </a>
      <a class="saved-link" href="saved.html">&#9825; <span id="saved-count">Saved</span></a>
    </header>

    <nav class="stepper" aria-label="Progress">
      <a class="step is-done" href="index.html">1. Screening</a>
      <span class="step-sep">&rsaquo;</span>
      <a class="step is-done" href="location.html">2. Location</a>
      <span class="step-sep">&rsaquo;</span>
      <span class="step is-active">3. Matches</span>
    </nav>

    <main>
      <div class="listing-toolbar card">
        <div class="filter-group" id="condition-filters" role="group" aria-label="Filter by condition">
          <button type="button" class="chip" data-condition="mental_cognitive">Mental &amp; Cognitive</button>
          <button type="button" class="chip" data-condition="cardiovascular">Cardiovascular</button>
          <button type="button" class="chip" data-condition="womens_health">Women's Health</button>
          <button type="button" class="chip" data-condition="eye">Eye</button>
          <button type="button" class="chip" data-condition="cancer">Cancer</button>
          <button type="button" class="chip chip--all is-active" data-condition="all">All</button>
        </div>

        <div class="toolbar-row">
          <label class="select-label">
            Duration
            <select id="duration-filter">
              <option value="any">Any</option>
              <option value="single">Single visit</option>
              <option value="short">Short-term (&le;1 month)</option>
              <option value="medium">Medium-term (1&ndash;6 months)</option>
              <option value="long">Long-term (6+ months)</option>
            </select>
          </label>

          <label class="select-label">
            Sort by
            <select id="sort-by">
              <option value="compensation">Compensation: high to low</option>
              <option value="distance">Distance: nearest first</option>
              <option value="duration">Duration: shortest first</option>
            </select>
          </label>

          <a href="location.html" class="btn-secondary edit-location-link">Edit search &rarr;</a>
        </div>
      </div>

      <p class="results-summary" id="results-summary" aria-live="polite">Loading studies&hellip;</p>

      <div class="study-grid" id="study-grid"></div>

      <p class="empty-state" id="empty-state" hidden>
        No studies match your filters yet. Try widening your distance or condition filters.
      </p>
    </main>
  </div>

  <template id="study-card-template">
    <article class="study-card">
      <button type="button" class="save-btn" aria-pressed="false" aria-label="Save study">&#9825;</button>
      <a class="study-card-link" href="#">
        <h3 class="study-title"></h3>
        <p class="study-org"></p>
        <div class="study-tags"></div>
        <div class="study-meta">
          <span class="meta-comp"></span>
          <span class="meta-duration"></span>
        </div>
      </a>
    </article>
  </template>

  <script src="js/csv-parser.js"></script>
  <script src="js/state.js"></script>
  <script src="js/data.js"></script>
  <script src="js/listing.js"></script>
</body>
</html>
