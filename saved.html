<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyMatch &mdash; Saved Studies</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="page page--wide">
    <header class="page-header">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true">&#128300;</span>
        <span class="brand-name">StudyMatch</span>
      </a>
      <a class="saved-link is-active" href="saved.html">&#9829; Saved</a>
    </header>

    <main>
      <h1 class="page-title">Saved Studies</h1>
      <p class="results-summary" id="results-summary" aria-live="polite">Loading&hellip;</p>
      <div class="study-grid" id="study-grid"></div>
      <p class="empty-state" id="empty-state" hidden>
        You haven't saved any studies yet. <a href="listing.html">Browse your matches &rarr;</a>
      </p>
    </main>
  </div>

  <template id="study-card-template">
    <article class="study-card">
      <button type="button" class="save-btn" aria-pressed="true" aria-label="Remove from saved">&#9829;</button>
      <a class="study-card-link" href="#">
        <h3 class="study-title"></h3>
        <p class="study-org"></p>
        <div class="study-tags"></div>
        <div class="study-meta">
          <span class="meta-comp"></span>
          <span class="meta-duration"></span>
        </div>
      </a>
    </article>
  </template>

  <script src="js/csv-parser.js"></script>
  <script src="js/state.js"></script>
  <script src="js/data.js"></script>
  <script src="js/saved.js"></script>
</body>
</html>
